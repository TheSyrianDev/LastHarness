<!doctype html><meta charset="utf-8"><title>Shadows and gradients</title>
<style>
body{font:16px sans-serif;margin:24px;background:#e9eef5;color:#1b2a3a}
.row{display:flex;gap:20px;margin:18px 0}
.card{width:190px;height:110px;border-radius:14px;padding:12px;box-sizing:border-box;background:#fff}
.s1{box-shadow:0 6px 18px rgba(0,0,0,.35)}
.s2{box-shadow:0 0 0 4px #6fa8ff, 0 10px 30px rgba(20,60,140,.45)}
.s3{box-shadow:inset 0 0 18px rgba(0,0,0,.4)}
.g1{background:linear-gradient(135deg,#1b6ca8,#6a5acd);color:#fff}
.g2{background:linear-gradient(to bottom,#fff 0%,#cfe3f7 50%,#9cc4ee 51%,#c7e0f8 100%);border:1px solid #6b8fb5}
.g3{background:radial-gradient(circle at 30% 30%,#fff,#7fb2e5 60%,#2b5f9b)}
.g4{background:repeating-linear-gradient(45deg,#dfe9f5 0 6px,#c4d6ea 6px 12px)}
.op{background:#1b6ca8;color:#fff;opacity:.55}
.rot{transform:rotate(-4deg);background:#fff3cd}
.clip{background:#c33;color:#fff;clip-path:circle(50px at 90px 55px)}
</style>
<h2>Shadows, gradients, radius, opacity</h2>
<div class="row"><div class="card s1">box-shadow blur</div><div class="card s2">ring + shadow</div><div class="card s3">inset shadow</div><div class="card g1">linear 135deg</div></div>
<div class="row"><div class="card g2">glossy bar</div><div class="card g3">radial</div><div class="card g4">repeating 45deg</div><div class="card op">opacity .55</div></div>
<div class="row"><div class="card rot">rotate -4deg</div><div class="card clip">clip-path circle</div></div>
