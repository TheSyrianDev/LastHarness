# Neutral white look: near-black primary buttons, grey bubbles, a plain sans.
name = "ChatGPT"
mode = "light"

[fonts]                         # optional; each is one name or a list tried in order (first installed wins)
latin = ["Inter", "Noto Sans", "Liberation Sans"]
arabic = ["Noto Sans Arabic", "Noto Naskh Arabic"]
mono = ["DejaVu Sans Mono", "Liberation Mono"]

[colors]
background = "#FFFFFF"
surface = "#F4F4F4"
sunken = "#F4F4F4"
text = "#0D0D0D"
muted = "#666666"
accent = "#0D0D0D"
accent_text = "#FFFFFF"
button = "#ECECEC"
button_hover = "#E0E0E0"
border = "#E5E5E5"
danger = "#C0392B"
focus_ring = "#0D0D0D"
warn = "#8A5A00"
good = "#16794a"

[background]
kind = "solid"
from = "#FFFFFF"
to = "#FFFFFF"
angle = 0
image_opacity = 0.6

[shape]
roundness = 16
match_window = false

[effects]
blur = false
shadow_blur = 0
shadow_y = 0
shadow_color = "#00000000"

[animation]
duration_ms = 140
