# Built-in look: Frutiger Aero, the glass look of Windows 7 (about 2009). Soft panes of lightly tinted, translucent
# glass over whatever is behind the window, a faint white line just inside the edge and a thin dark one outside it,
# a soft diagonal glow in the top left corner of each pane, buttons with a smooth gradient and a fading gloss that
# glow blue when the pointer is over them, wide soft shadows. Nothing is sharp: no hard edges, no fine lines.
# No picture ships with it: the desktop behind the window (blurred by the compositor, which Hyprland does for you)
# is the background. Copy this file to ~/.config/lastharness/themes/ and edit it; changes show up while the app runs.
#
# To put a photo behind the glass inside the window instead, set in the background table:
#   kind = "image"
#   image = "/home/you/Pictures/sky.jpg"     # a full path, or one relative to this file
#   image_opacity = 1
name = "Frutiger Aero"
mode = "light"          # light or dark

[colors]                        # "#rgb", "#rrggbb" or "#rrggbbaa" (the last two digits are opacity)
background = "#4a7db3"      # a solid blue: what the glass is drawn on when nothing translucent is available,
                            # and the base the gradient below is chosen to sit on
surface = "#e6f0faa6"       # panels and bubbles, for a pane without [glass]
sunken = "#f7fbffeb"        # input fields and replies: near white, like a text box on a Windows 7 window
text = "#0f1f2d"
muted = "#34506a"
accent = "#2f7fc7"
accent_text = "#ffffff"
button = "#dbe7f3"
button_hover = "#eef6fd"
border = "#ffffffb8"
danger = "#c0392b"

[background]
kind = "gradient"             # solid, gradient or image
from = "#8cbfeb40"            # a light blue tint, a quarter opaque, so the desktop shows through
to = "#4f86bf40"
angle = 180

[shape]
roundness = 9                   # corner radius of panes, in pixels (Windows 7 windows were about 8)
match_window = false             # true: take the window's own radius when the desktop reports it
                                 # (Hyprland does); controls inside panes follow the same curve

[glass]                          # panes: a lightly tinted, translucent fill, lighter at the top, soft all over
top = "#e6f2fb9e"
bottom = "#c4dcf094"
rim = "#ffffff80"                # the white line just inside the edge: about half white, 1 px
edge = "#00000070"               # the dark neutral line just outside it: under half black, 1 px
sheen = 0.12                     # a faint white glow over the top of a pane; 0 for none
reflection = 0.16                # the soft diagonal glow in the top left corner, fading out; 0 for none
lines = 0                        # fine diagonal hairlines; off, they read as brushed metal. At most 0.05
lines_gap = 10                   # pixels between the hairlines, when on (8 or more)

[gel]                            # buttons: a smooth gradient with a soft gloss that fades, glow on hover
top = "#f2f2f2"
bottom = "#cfcfcf"
primary_top = "#7dbcf0"          # the main button is blue glass
primary_bottom = "#3d8bd0"
gloss = 0.38                     # the gloss fades from this opacity to nothing, with no hard stop
rim = "#ffffff99"
edge = "#707070"
glow = "#4aaef0b0"               # the blue glow while the pointer is over a button; the button takes on the blue too
press = 0.12

[focus]                          # the border of the pane you are working in
from = "#2f8fe0"
to = "#86c6f6"
width = 2

[effects]
blur = true                      # ask the desktop to blur what is behind the window (Hyprland blur needs nothing more)
shadow_blur = 44                 # a wide, faint shadow: the panes float
shadow_y = 10
shadow_color = "#0000003a"

[animation]
duration_ms = 160           # 0 turns hover and press fades off
