# Built-in look. Liquid glass panels, pop-ups and controls (the [material] table). Copy this file to
# ~/.config/lastharness/themes/ and edit it; changes show up while the app runs.
name = "Glass"
mode = "dark"          # light or dark

[colors]                        # "#rgb", "#rrggbb" or "#rrggbbaa" (the last two digits are opacity)
background = "#182236e2"
surface = "#ffffff14"       # panels and bubbles; the glass is tinted with this
sunken = "#0000005e"          # input fields
text = "#f2f6ff"
muted = "#aab6c8"
accent = "#6aa6ff"
accent_text = "#071427"
button = "#ffffff2a"
button_hover = "#ffffff48"
border = "#ffffff2e"         # a soft light hairline; the glass adds its own rim
danger = "#ff7b6e"
bubble = "#ffffff14"           # your own messages: clear, neutral glass with a white rim
focus_ring = "#8ab9ff"
warn = "#ffc66e"
good = "#7fdc98"

[background]
kind = "gradient"             # solid, gradient or image
from = "#182236e2"
to = "#0c101ceb"
angle = 135
# image = "wallpaper.png"        # relative to this file; used when kind = "image"
image_opacity = 0.6

[shape]
roundness = 20                  # corner radius of panels, in pixels
match_window = false             # true: take the window's own radius when the desktop reports it
                                 # (Hyprland does); controls inside panels follow the same curve

[effects]
blur = true                     # ask the desktop to blur what is behind the window
shadow_blur = 30
shadow_y = 10
shadow_color = "#00000070"

[material]                      # liquid glass; leave the table out for flat surfaces
panels = "regular"              # the sidebar, the rail and cards: frosted
side_panel = "clear"            # the panel on the right: see-through (tinted turns milky on dark)
popups = "regular_tinted"       # menus and dialogs: frosted and nearly solid, so their words stay clear
controls = "clear"              # knobs, switches and the segmented thumb: clear drops
blur = 6                        # pixels; none, regular, clear, regular_tinted or clear_tinted above
refraction = 8
rim = 0.45

[animation]
duration_ms = 220           # 0 turns hover and press animation off
