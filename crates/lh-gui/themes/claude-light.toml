# Warm cream look with a clay accent and a serif for text.
name = "Claude"
mode = "light"

[fonts]                         # optional; each is one name or a list tried in order (first installed wins)
latin = ["Source Serif 4", "Source Serif Pro", "Lora", "Noto Serif", "Liberation Serif"]
arabic = ["Noto Naskh Arabic", "Noto Sans Arabic"]
mono = ["JetBrains Mono", "DejaVu Sans Mono"]

[colors]
background = "#F5F4EE"
surface = "#FAF9F5"
sunken = "#EDEBE2"
text = "#29261F"
muted = "#66625B"
accent = "#B5532F"
accent_text = "#FFFFFF"
button = "#E8E5DA"
button_hover = "#DDD9CB"
border = "#DDD9CB"
danger = "#B3392B"
focus_ring = "#C96442"
warn = "#8A5A00"
good = "#1f7a3d"

[background]
kind = "solid"
from = "#F5F4EE"
to = "#F5F4EE"
angle = 0
image_opacity = 0.6

[shape]
roundness = 14
match_window = false

[effects]
blur = false
shadow_blur = 0
shadow_y = 0
shadow_color = "#00000000"

[animation]
duration_ms = 140
