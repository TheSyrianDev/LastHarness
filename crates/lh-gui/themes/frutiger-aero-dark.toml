# Built-in look: Frutiger Aero, dark. The black glass variant of the Windows 7 look: dark blue-grey panes of
# translucent glass over whatever is behind the window, a faint pale line just inside the edge, a soft diagonal glow
# in the corner, buttons that glow blue under the pointer. Nothing is sharp. No picture ships with it. Copy this file to
# ~/.config/lastharness/themes/ and edit it; changes show up while the app runs. The keys are explained in
# frutiger-aero-light.toml.
name = "Frutiger Aero"
mode = "dark"

[colors]
background = "#1b2a3b"      # a solid dark blue: what the glass is drawn on when nothing translucent is available
surface = "#1b2a3ba6"
sunken = "#0b131dd9"
text = "#eef5fc"
muted = "#9db4ca"
accent = "#4aa3ee"
accent_text = "#06121e"
button = "#2b3d52"
button_hover = "#3b5069"
border = "#ffffff30"
danger = "#e5584a"

[background]
kind = "gradient"
from = "#0c1b2d50"
to = "#040d1858"
angle = 180

[shape]
roundness = 9
match_window = false

[glass]
top = "#2b405ab3"
bottom = "#142130bf"
rim = "#ffffff55"
edge = "#00000080"
sheen = 0.07
reflection = 0.10
lines = 0
lines_gap = 10

[gel]
top = "#4b5f75"
bottom = "#232f3c"
primary_top = "#5aaef2"
primary_bottom = "#2a74c4"
gloss = 0.22
rim = "#ffffff40"
edge = "#00000099"
glow = "#58b6ffb8"
press = 0.18

[focus]
from = "#4aa3ee"
to = "#a4d6ff"
width = 2

[effects]
blur = true
shadow_blur = 48
shadow_y = 12
shadow_color = "#00000078"

[animation]
duration_ms = 160
