[package]
name = "lh-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lhd"
path = "src/main.rs"

[dependencies]
lh-provider = { path = "../lh-provider" }
lh-tools = { path = "../lh-tools" }
lh-secrets = { path = "../lh-secrets" }
lh-spend = { path = "../lh-spend" }
lh-memory = { path = "../lh-memory" }
lh-store = { path = "../lh-store" }
tokio = { workspace = true, features = ["net", "sync", "signal", "fs"] }
axum = "0.8"
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
reqwest.workspace = true
